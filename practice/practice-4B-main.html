<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Main Content Practice - Round 2</title>
    <style>
        /* CSS will go here */
    </style>
</head>
<body>

    <main class="main-layout">
    
        <!-- Left Column -->
        <section class="bio-column">
            <h3>BIO</h3>
            <p>The CSS justify-content property controls alignment along the main axis of the container.</p>
            
            <h3>SKILLS</h3>
            <ul>
                <li>Skill 1</li>
                <li>Skill 2</li>
                <li>Skill 3</li>
                <li>Skill 4</li>
            </ul>
        </section>

        <!-- Right Column -->
        <section class="feed-column">
            <h3>ACTIVITY FEED</h3>
            
            <div class="activity-card">
                <section class="activity-left">
                    <div class="activity-icon">
                        <img src="" alt="ICON">
                    </div>
                    <div class="activity-info">
                        <p>Activity Title</p>
                        <p>Description</p>
                    </div>
                </section>
                <p class="activity-date">Date</p>
            </div>
            
            <h3>PROJECTS</h3>
            <div class="projects-grid">
                <section class="project-card">
                    <div class="project-desc">
                        <p>Project 1</p>
                        <p>Description</p>
                    </div>
                </section>
                <section class="project-card">
                    <div class="project-desc">
                        <p>Project 2</p>
                        <p>Description</p>
                    </div>
                </section>
                <section class="project-card">
                    <div class="project-desc">
                        <p>Project 3</p>
                        <p>Description</p>
                    </div>
                </section>
            </div>
        </section>
    </main>

</body>
</html>
